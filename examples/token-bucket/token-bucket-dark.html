32.5M291.6 338.7L291.6 333.4M289.7 339.4L289.7 334.1M287.7 340.1L287.7 334.8M285.6 340.7L285.6 335.4M283.4 341.2L283.4 335.9M281.1 341.6L281.1 336.3M278.8 341.9L278.8 336.6M276.5 342.1L276.5 336.8M274.1 342.3L274.1 337M271.7 342.3L271.7 337M269.3 342.3L269.3 337M266.9 342.1L266.9 336.8M264.5 341.9L264.5 336.6M262.2 341.6L262.2 336.3M260 341.2L260 335.9M257.8 340.7L257.8 335.4M255.7 340.1L255.7 334.8M253.7 339.4L253.7 334.1M251.8 338.7L251.8 333.4M250 337.8L250 332.5M248.4 337L248.4 331.7M246.9 336L246.9 330.7M245.6 335L245.6 329.7M244.4 334L244.4 328.7M243.4 332.9L243.4 327.6M242.6 331.7L242.6 326.4M241.9 330.6L241.9 325.3M241.4 329.4L241.4 324.1M241.2 328.2L241.2 322.9"/><path class="ix-line" data-tone="lo" d="M289.3 329.1L286.9 330.2L284.2 331.1L281.2 331.8L278.1 332.3L274.9 332.7L271.7 332.8L268.4 332.7L265.2 332.3L262.1 331.8L259.2 331.1L256.5 330.2L254 329.1L251.9 327.9L250.1 326.5L248.6 325.1L247.6 323.5L246.9 321.9L246.7 320.3L246.9 318.7L247.6 317.1L248.6 315.5L250.1 314L251.9 312.7L254 311.5L256.5 310.4L259.2 309.5L262.1 308.7L265.2 308.2L268.4 307.9L271.7 307.8L274.9 307.9L278.1 308.2L281.2 308.7L284.2 309.5L286.9 310.4L289.3 311.5L291.5 312.7L293.3 314L294.8 315.5L295.8 317.1L296.4 318.7L296.7 320.3L296.4 321.9L295.8 323.5L294.8 325.1L293.3 326.5L291.5 327.9Z"/><path class="ix-line" data-tone="mid" d="M275.3 322.1L274 322.6L272.5 322.8L270.9 322.8L269.3 322.6L268 322.1L267.1 321.5L266.6 320.7L266.6 319.9L267.1 319.1L268 318.5L269.3 318L270.9 317.7L272.5 317.7L274 318L275.3 318.5L276.3 319.1L276.8 319.9L276.8 320.7L276.3 321.5Z"/></g></g></svg></div></div><figcaption class="ix-legend"><span class="ix-keys"><span class="ix-key"><i data-mark="lit"></i>token (a coin)</span><span class="ix-key"><i data-mark="mid"></i>limiter hardware</span></span><span>The tube holds at most 8 tokens. The feeder adds one every 1/rate seconds and drops it when the tube is full. Each request pushes out the bottom coin; with none left the request is rejected, which is a 429.</span></figcaption></figure></main><script type="module">
const P = {"origin":[271.68207617656253,328.4442591433234],"scale":2.3557407017266736,"azimuth":45,"elevation":30};
const RAD = Math.PI / 180;
const iso = ([x, y, z]) => { const a = P.azimuth * RAD, e = P.elevation * RAD, k = P.scale; return [P.origin[0] + (x * Math.sin(a) - y * Math.cos(a)) * k, P.origin[1] + ((x * Math.cos(a) + y * Math.sin(a)) * Math.sin(e) - z * Math.cos(e)) * k]; };
const along = (v) => { const [ax, ay] = iso([0, 0, 0]); const [bx, by] = iso(v); return "translate(" + (bx - ax).toFixed(2) + " " + (by - ay).toFixed(2) + ")"; };
const onPlane = (pts, z) => pts.map(([x, y], i) => { const [sx, sy] = iso([x, y, z]); return (i ? "L" : "M") + sx.toFixed(2) + " " + sy.toFixed(2); }).join("");
const follow = (from, to, dt, tau) => to + (from - to) * Math.exp(-dt / tau);
const stillQuery = matchMedia("(prefers-reduced-motion: reduce)");
function loop(stage, tick) {
  let frame = 0, last = 0, visible = false;
  const step = (now) => { const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now; const more = tick(dt, stillQuery.matches); frame = visible && more !== false ? requestAnimationFrame(step) : 0; };
  const wake = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(step); } };
  new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) wake(); }, { rootMargin: "120px 0px" }).observe(stage);
  // #t=2.5 runs the figure 2.5 s ahead in fixed steps before the first paint: deterministic shots for review.
  const ahead = Number((location.hash.match(/t=([\d.]+)/) || [])[1] || 0);
  for (let i = 0; i < Math.round(ahead * 60); i++) tick(1 / 60, false);
  return wake;
}

const CAP = 8, RATES = [0.5,1,2,4];
const DISC_H = 4, PITCH = 4.5, FLOOR = 6, POST_TOP = 54, STROKE = 27, STOP_DX = 45;
const TUBE_BOTTOM = 78, GATE_OPEN = 34;
const KNOB = ["M379.5 265.4L374.1 265.4","M383.3 263.5L383.3 260.8","M387.1 265.4L392.5 265.4","M383.3 267.2L383.3 270"];
// The truth the figure shows: an integer token bucket.
// Capacity CAP tokens. One token is added every 1 / rate seconds while the bucket is below CAP
// (a full bucket drops the refill, as a real limiter does). A request takes one token or is rejected.




function bucket({ cap = CAP, rate = 1, tokens = cap } = {}) {
  return { cap, rate, tokens, clock: 0, accepted: 0, rejected: 0 };
}

/** Advance time. Returns how many tokens were added, so the feeder can drop that many discs. */
function advance(state, dt) {
  if (state.tokens >= state.cap) {
    state.clock = 0;
    return 0;
  }
  state.clock += dt;
  let added = 0;
  const every = 1 / state.rate;
  while (state.clock >= every && state.tokens < state.cap) {
    state.clock -= every;
    state.tokens += 1;
    added += 1;
  }
  return added;
}

/** One request. True when a token was taken. */
function request(state) {
  if (state.tokens >= 1) {
    state.tokens -= 1;
    state.accepted += 1;
    return true;
  }
  state.rejected += 1;
  return false;
}

const stage = document.querySelector(".ix-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const layer = (name) => svg.querySelector('[data-layer="' + name + '"]');
const ejectLayer = layer("eject"), stackLayer = layer("stack"), highLayer = layer("high"), poolLayer = layer("pool");
const pusherEl = svg.querySelector('[data-part="pusher"]');
const gateEl = svg.querySelector('[data-part="gate"]');
const knobEl = svg.querySelector('[data-part="knob"]');
const free = [...poolLayer.children];
const G = 1400;

let rateIndex = 1;
const state = bucket({ cap: CAP, rate: RATES[rateIndex], tokens: CAP });
const take = () => { const el = free.pop(); el.style.display = ""; el.style.opacity = ""; return el; };
const give = (el) => { el.style.display = "none"; poolLayer.appendChild(el); free.push(el); };
const stack = [...stackLayer.children].map((el, i) => ({ el, z: FLOOR + i * PITCH, v: 0 }));
const falling = [];
const ejects = [];
let last = "ready", queue = 0, gateOpen = 0, gateHold = 0;
const push = { x: 0, phase: "idle", t: 0, carrying: null };
let idle = 0, tourClock = 0, touring = !stillQuery.matches;

const ease = (t) => 1 - Math.pow(1 - t, 3);
const baseOf = () => (push.phase === "out" || push.phase === "hold") && push.carrying ? DISC_H : 0;

function setOrder(parent, els) {
  const kids = parent.children;
  let same = kids.length === els.length;
  for (let i = 0; same && i < els.length; i++) same = kids[i] === els[i];
  if (!same) for (const el of els) parent.appendChild(el);
}

function startStroke() {
  const ok = request(state);
  last = ok ? "accepted" : "rejected 429";
  push.phase = "out"; push.t = 0;
  push.carrying = ok ? stack.shift() : null;
  if (push.carrying) ejects.push({ el: push.carrying.el, dx: 0, v: 0, rest: 0 });
}

function tick(dt, still) {
  let busy = false;
  if (touring) {
    tourClock += dt;
    // a burst of 16 requests, 0.32 s apart, against 8 tokens and a 1/s refill: the last few are rejected
    const cycle = tourClock % 12;
    const want = cycle < 5.12 ? Math.floor(cycle / 0.32) + 1 : 0;
    if (want > (tick.sent || 0)) { queue += 1; tick.sent = want; }
    if (cycle >= 5.12) tick.sent = 0;
    busy = true;
  } else if ((idle += dt) > 5 && !stillQuery.matches) { touring = true; tourClock = 0; tick.sent = 0; }

  // refill: the model adds tokens; each one is a coin released through the gate
  const added = advance(state, dt);
  for (let i = 0; i < added; i++) { if (free.length) falling.push({ el: take(), z: TUBE_BOTTOM - DISC_H + 2, v: 0 }); gateHold = 0.22; }
  if (state.tokens < state.cap) busy = true;

  gateHold = Math.max(0, gateHold - dt);
  gateOpen = still ? (gateHold > 0 ? 1 : 0) : follow(gateOpen, gateHold > 0 ? 1 : 0, dt, 0.045);
  gateEl.setAttribute("transform", along([-GATE_OPEN * gateOpen, 0, 0]));
  if (Math.abs(gateOpen - (gateHold > 0 ? 1 : 0)) > 0.002) busy = true;

  // pusher: one stroke per request; it waits while the only coin is still falling
  if (push.phase === "idle" && queue > 0 && !(state.tokens >= 1 && stack.length === 0)) { queue -= 1; startStroke(); }
  if (push.phase !== "idle") {
    busy = true;
    push.t += still ? 1 : dt;
    if (push.phase === "out") {
      const k = Math.min(1, push.t / 0.12);
      push.x = STROKE * ease(k);
      const riding = ejects.find((c) => c.el === push.carrying?.el);
      if (riding) riding.dx = push.x;
      if (k >= 1) { push.phase = "hold"; push.t = 0; if (riding) riding.v = still ? 0 : 175; }
    } else if (push.phase === "hold") {
      if (push.t >= 0.04) { push.phase = "back"; push.t = 0; push.carrying = null; }
    } else {
      const k = Math.min(1, push.t / 0.14);
      push.x = STROKE * (1 - ease(k));
      if (k >= 1) { push.phase = "idle"; push.x = 0; }
    }
  }
  pusherEl.setAttribute("transform", along([push.x, 0, 0]));

  // each knocked-out coin slides to the end stop under friction, then is spent (fades)
  const decel = (175 * 175) / (2 * (STOP_DX - STROKE));
  for (let i = 0; i < ejects.length; i++) {
    const c = ejects[i];
    busy = true;
    if (push.phase !== "out" || c.el !== push.carrying?.el) {
      if (still) { c.dx = STOP_DX; c.v = 0; }
      if (c.v > 0) { c.v = Math.max(0, c.v - decel * dt); c.dx = Math.min(STOP_DX, c.dx + c.v * dt); if (c.dx === STOP_DX) c.v = 0; }
      if (c.v === 0 && c.dx > STROKE - 0.5) c.rest += still ? 1 : dt;
    }
    const alpha = Math.max(0, 1 - Math.max(0, c.rest - 0.04) / 0.2);
    c.el.style.opacity = alpha.toFixed(3);
    c.el.setAttribute("transform", along([c.dx, 0, FLOOR]));
    if (alpha <= 0) { give(c.el); ejects.splice(i, 1); i--; }
  }

  // the stack settles under gravity onto the boss, or onto the pusher while it is out
  const base = baseOf();
  stack.forEach((c, i) => {
    const target = FLOOR + base + i * PITCH;
    if (still || c.z <= target) { c.z = target; c.v = 0; } else { c.v += G * dt; c.z = Math.max(target, c.z - c.v * dt); busy = true; if (c.z === target) c.v = 0; }
    c.el.setAttribute("transform", along([0, 0, c.z]));
  });
  for (let i = 0; i < falling.length; i++) {
    const c = falling[i];
    const target = FLOOR + base + stack.length * PITCH;
    if (gateOpen < 0.6 && c.z > TUBE_BOTTOM - DISC_H - 1 && !still) { c.el.setAttribute("transform", along([0, 0, c.z])); busy = true; continue; }
    c.v += G * dt; c.z -= c.v * dt;
    if (still || c.z <= target) { c.z = target; c.v = 0; stack.push(c); falling.splice(i, 1); i--; }
    else busy = true;
    c.el.setAttribute("transform", along([0, 0, c.z]));
  }
  setOrder(stackLayer, [...stack.map((c) => c.el), ...falling.filter((c) => c.z + DISC_H <= POST_TOP + 2).map((c) => c.el)]);
  setOrder(highLayer, falling.filter((c) => c.z + DISC_H > POST_TOP + 2).map((c) => c.el));
  setOrder(ejectLayer, ejects.map((c) => c.el));

  const text = "tokens " + state.tokens + "/" + CAP + " · refill " + state.rate + "/s · " + last;
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
  return busy || queue > 0;
}

const wake = loop(stage, tick);
const touch = () => { touring = false; idle = 0; };
const send = () => { touch(); queue = Math.min(queue + 1, 12); wake(); };
const setRate = (i) => { rateIndex = Math.max(0, Math.min(RATES.length - 1, i)); state.rate = RATES[rateIndex]; knobEl.setAttribute("d", KNOB[rateIndex]); wake(); };
stage.addEventListener("pointerdown", (e) => { e.preventDefault(); stage.focus({ preventScroll: true }); send(); });
stage.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); send(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); touch(); setRate(rateIndex + 1); }
  else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); touch(); setRate(rateIndex - 1); }
});
stillQuery.addEventListener("change", () => { touring = !stillQuery.matches; wake(); });
setRate(rateIndex);
wake();
</script></body></html>
